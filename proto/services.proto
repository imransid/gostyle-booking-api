syntax = "proto3";
package gostyle.services.v1;





service ServicesDirectory {
  rpc ListServices (ListServicesRequest) returns (ListServicesResponse);
  rpc ListPackages (ListPackagesRequest) returns (ListPackagesResponse);
}



message ListServicesRequest {
  string tenant_id = 1;
  string branch_id = 2;
  string category_id = 3;
}

message ListServicesResponse {
  repeated Service services = 1;
}

message Service {
  string service_id = 1;
  string name = 2;
  string description = 3;
  int32 price_minor = 4;
  string currency = 5;
  int32 duration_minutes = 6;
  string category_id = 7;
  string category_name = 8;

  // EMPTY MEANS UNKNOWN — DO NOT COERCE TO LEVEL 0.
  string skill_id = 9;
  string min_skill_level = 10;

  repeated string photo_urls = 11;
  repeated string included_steps = 12;
}


message ListPackagesRequest {
  string tenant_id = 1;
  string branch_id = 2;
}

message PackageItem {
  string service_id = 1;
  int32 quantity = 2;
  // The service variant this line is pinned to ("Long hair"). EMPTY: none.
  string variant_id = 3;
}

message PackageInfo {
  string package_id = 1;
  string name = 2;
  int32 price_minor = 3;
  string currency = 4;
  repeated PackageItem items = 5;
  // THIS PACKAGE IS AS THE LIVE MENU SELLS IT: name, price and items from the
  // published snapshot (or the row, for one never snapshotted). booking-api
  // sells only packages that say so, so a platform older than this field
  // sells none of its packages rather than its drafts.
  bool from_published_snapshot = 6;
}

message ListPackagesResponse {
  repeated PackageInfo packages = 1;
}