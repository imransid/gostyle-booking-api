services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gostyle
      POSTGRES_PASSWORD: gostyle
      POSTGRES_DB: gostyle_booking
      TZ: UTC
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gostyle -d gostyle_booking']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata: